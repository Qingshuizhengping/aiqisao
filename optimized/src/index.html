<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090b">
<meta name="description" content="薇之雨 AI 七嫂 — 美业问答助手，从调肤知识到门店经营。">
<meta name="color-scheme" content="light dark">
<title>薇之雨 · AI 七嫂</title>

<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/static/img/icon-192.png">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">

<!-- 主题在首帧之前定好，避免白闪/暗闪 -->
<script>
(function () {
    var root = document.documentElement;
    var theme = 'light';
    try {
        var saved = localStorage.getItem('qisao_theme');
        theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
    root.dataset.theme = theme;
    // 移动端先定高度，避免键盘/地址栏造成的首屏跳动
    var h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    if (h) root.style.setProperty('--app-height', h + 'px');
})();
</script>

<style>
/*__STYLES__*/
</style>
</head>
<body>

<!-- 背景：WebGL 光场（可缺失） + CSS 渐变兜底 + 颗粒 -->
<div class="backdrop" aria-hidden="true">
    <canvas id="lightField"></canvas>
</div>

<!-- 液态玻璃折射滤镜 -->
<svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
        <filter id="glassLens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.007 0.013" numOctaves="2" seed="9" result="noise"/>
            <feGaussianBlur in="noise" stdDeviation="1.5" result="soft"/>
            <feDisplacementMap in="SourceGraphic" in2="soft" scale="22" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </defs>
</svg>

<button class="sidebar-overlay" id="sidebarOverlay" type="button" tabindex="-1" aria-label="关闭对话导航" onclick="closeSidebar()"></button>

<aside class="sidebar" id="sidebar" aria-label="对话导航">
    <div class="sidebar-brand">
        <picture class="avatar-frame brand-avatar">
            <source type="image/webp" srcset="/static/img/avatar-192.webp">
            <img class="avatar-img" src="/static/img/avatar-192.png" alt="" width="192" height="192" decoding="async">
        </picture>
        <div class="brand-wordmark"><strong>薇之雨</strong><span>AI 七嫂 · 你的美业同行者</span></div>
        <button class="icon-button glass sidebar-close" type="button" aria-label="关闭对话导航" onclick="closeSidebar()"><span class="ui-icon icon-close" aria-hidden="true"></span></button>
    </div>

    <button class="new-chat-btn glass" type="button" onclick="newChat()">
        <span class="ui-icon icon-compose" aria-hidden="true"></span><span>开启新对话</span>
        <span class="new-chat-plus" aria-hidden="true">+</span>
    </button>

    <a class="new-chat-btn glass studio-entry" href="/image">
        <span class="ui-icon icon-image" aria-hidden="true"></span><span>素材生成</span>
        <span class="new-chat-plus" aria-hidden="true">›</span>
    </a>

    <div class="sidebar-section-label">最近对话</div>
    <nav class="sidebar-list" id="sidebarList" aria-label="历史对话"></nav>

    <div class="sidebar-footer">
        <span class="ui-icon icon-message" aria-hidden="true"></span>
        <div><span>认真听你说，用心为你答</span><small>对话记录仅保存在此设备</small></div>
    </div>
</aside>

<main class="main is-welcome" id="mainPanel" aria-busy="false">
    <header class="header">
        <button class="icon-button glass menu-btn" id="menuBtn" type="button" aria-label="打开对话导航" aria-controls="sidebar" aria-expanded="false" onclick="toggleSidebar()"><span class="ui-icon icon-sidebar" aria-hidden="true"></span></button>
        <div class="header-info"><h1>AI 七嫂</h1><span class="header-divider" aria-hidden="true"></span><p>美业问答</p></div>
        <span class="header-badge"><span class="badge-dot" aria-hidden="true"></span>薇之雨品牌专属助手</span>
        <button class="theme-toggle glass" id="themeToggle" type="button" aria-label="切换深色模式" aria-pressed="false" onclick="toggleTheme()">
            <span class="ui-icon icon-sun" aria-hidden="true"></span>
            <span class="ui-icon icon-moon" aria-hidden="true"></span>
        </button>
    </header>

    <div class="offline-banner" id="offlineBanner" role="status">暂时无法连接网络，历史对话仍可查看。联网后即可继续提问。</div>
    <div class="update-banner" id="updateBanner" role="status" hidden><span>新版界面已就绪，对话与草稿会保留。</span><button type="button" id="updateAppBtn">更新界面</button></div>

    <div class="conversation-workspace">
        <div class="chat-container" id="chatContainer" role="log" aria-label="与七嫂的对话" aria-live="polite" aria-relevant="additions"></div>

        <div class="input-area">
            <div class="input-wrapper">
                <div class="input-box glass glass--lens">
                    <label class="visually-hidden" for="userInput">向 AI 七嫂提问</label>
                    <textarea id="userInput" placeholder="聊聊你遇到的问题，七嫂来帮你理思路…" rows="2" aria-describedby="inputNote" onkeydown="handleKeyDown(event)"></textarea>
                    <div class="composer-toolbar">
                        <span class="assistant-label"><span class="ui-icon icon-sparkles" aria-hidden="true"></span>AI 七嫂</span>
                        <span class="composer-context">美业专属问答</span>
                        <span class="keyboard-hint">Enter 发送 · Shift + Enter 换行</span>
                        <button class="send-btn glass" id="sendBtn" type="button" aria-label="发送消息" title="发送消息" onclick="sendMessage()"><span class="ui-icon icon-arrow" aria-hidden="true"></span></button>
                    </div>
                </div>

                <div class="quick-section">
                    <span class="quick-label">试着问问</span>
                    <div class="quick-buttons" aria-label="快捷提问">
                        <button class="quick-btn glass" type="button" onclick="quickAsk('调肤原理是什么？')">调肤原理</button>
                        <button class="quick-btn glass" type="button" onclick="quickAsk('产品安全吗？')">产品安全</button>
                        <button class="quick-btn glass" type="button" onclick="quickAsk('多久见效？')">多久见效</button>
                        <button class="quick-btn glass" type="button" onclick="quickAsk('批发体系是什么？')">批发体系</button>
                        <button class="quick-btn glass" type="button" onclick="quickAsk('门店如何拓客？')">门店拓客</button>
                    </div>
                </div>

                <p class="input-note" id="inputNote">AI 回答仅供参考，请结合实际情况判断。</p>
            </div>
        </div>
    </div>

    <footer class="brand-note">“美业就是修心，修好了自己的心，客户自然就来了。”<span>— 七嫂</span></footer>
</main>

<template id="welcomeTemplate">
    <section class="welcome-section" id="welcomeSection" aria-labelledby="welcomeTitle">
        <picture class="avatar-frame welcome-icon">
            <source type="image/webp" srcset="/static/img/avatar-192.webp">
            <img class="avatar-img" src="/static/img/avatar-192.png" alt="AI 七嫂" width="192" height="192" fetchpriority="high" decoding="async">
        </picture>
        <span class="welcome-eyebrow">薇之雨 · 你的美业同行者</span>
        <h2 id="welcomeTitle">你好，我是 AI 七嫂</h2>
        <p>从调肤知识到门店经营，<br class="mobile-break">把你的问题交给七嫂。</p>
    </section>
</template>

<script src="/static/js/app.js?v=20261021-7" defer></script>
</body>
</html>
