# AI 七嫂 · nginx 配置片段
# 现有线上是 nginx 反代 127.0.0.1:3000，这里只补缓存/压缩相关部分。
# 如果你让 express 直接管静态文件（server.js 已经做了），下面 static 段可以不要；
# 但 nginx 直接吐静态更快，推荐保留。

server {
    listen 443 ssl http2;
    server_name 8.134.141.217;

    ssl_certificate     /etc/nginx/ssl/aiqisao.crt;
    ssl_certificate_key /etc/nginx/ssl/aiqisao.key;

    root /var/www/aiqisao/public;

    # ---------- 压缩 ----------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/html text/css text/plain
        application/javascript application/json
        image/svg+xml;

    # 装了 brotli 模块才开（nginx 官方包默认没有）
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/html text/css application/javascript application/json image/svg+xml;

    # ---------- HTML：永远回源校验，避免发布后拿到旧壳 ----------
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }

    # ---------- 不变的静态资源：长缓存 ----------
    location /static/img/ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    location /static/js/ {
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        try_files $uri =404;
    }

    # ---------- Service Worker 必须短缓存，否则更新推不下去 ----------
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # ---------- 接口：不缓存，关掉缓冲保证 SSE 实时 ----------
    location = /api/image/prepare {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;

        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
