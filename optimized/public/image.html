play:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:48px;padding:12px 18px;border:0;border-radius:14px;background:var(--accent);color:var(--canvas);font-size:14px;font-weight:600;letter-spacing:.3px;box-shadow:0 10px 24px -14px #4a6741cc;transition:transform .2s cubic-bezier(.32,.72,0,1),box-shadow .2s ease,opacity .2s ease}.generate-btn .ui-icon{width:17px;height:17px}.generate-btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 14px 28px -14px #4a6741d9}.generate-btn:not(:disabled):active{transform:scale(.985)}.generate-btn:disabled{opacity:.55}.studio-hint{margin:-6px 0 0;color:var(--muted);font-size:10.5px;text-align:center}.studio-stage-wrap{display:flex;flex-direction:column;gap:16px;min-width:0}.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:430px;padding:16px;border:1px solid var(--line);border-radius:var(--radius-panel);background:radial-gradient(120% 90% at 50% 0%,var(--glass-fill-soft),transparent 70%),var(--glass-fill);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 0 0 .5px var(--glass-hair),var(--shadow-sm),inset 0 1px 0 var(--inner-top)}.stage-empty{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--secondary);text-align:center}.stage-empty-icon{width:40px;height:40px;color:var(--muted);opacity:.55}.stage-empty p{margin:4px 0 0;font-size:13px}.stage-empty small{color:var(--muted);font-size:11px;line-height:1.7}.stage-loading{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}.loading-plate{width:min(100%,320px);aspect-ratio:1 / 1;border-radius:16px;background:linear-gradient(110deg,var(--glass-fill-soft) 8%,var(--glass-fill-strong) 24%,var(--glass-fill-soft) 40%);background-size:220% 100%;animation:plateShimmer 1.5s linear infinite}@keyframes plateShimmer{to{background-position:-220% 0}}.loading-meta{display:flex;align-items:center;gap:10px;color:var(--secondary);font-size:12px}.loading-dots{display:inline-flex;gap:4px}.loading-dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:dotPulse 1.1s ease-in-out infinite}.loading-dots i:nth-child(2){animation-delay:.16s}.loading-dots i:nth-child(3){animation-delay:.32s}@keyframes dotPulse{0%,to{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}.stage-result{display:flex;flex-direction:column;gap:12px;width:100%}.stage-result img{display:block;width:100%;max-height:62vh;border-radius:14px;background:var(--glass-fill-soft);object-fit:contain;cursor:zoom-in}.result-actions{display:flex;flex-wrap:wrap;gap:8px}.result-btn{padding:8px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--glass-fill-soft);color:var(--secondary);font-size:11.5px;text-decoration:none;transition:all .2s ease}.result-btn:hover{border-color:var(--accent-line);color:var(--accent-ink);background:var(--accent-soft)}.result-prompt{margin:0;color:var(--muted);font-size:10.5px;line-height:1.7;display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2}.stage-error{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;text-align:center}.stage-error p{margin:0;max-width:420px;color:var(--danger);font-size:12.5px;line-height:1.8}.history-block{display:flex;flex-direction:column;gap:10px}.history-head{display:flex;align-items:baseline;justify-content:space-between}.history-head>span{color:var(--muted);font-size:10.5px;letter-spacing:.8px}.history-clear{border:0;background:transparent;color:var(--muted);font-size:10.5px}.history-clear:hover{color:var(--danger)}.history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.history-item{position:relative;overflow:hidden;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--glass-fill-soft);aspect-ratio:1 / 1;transition:border-color .2s ease,transform .2s cubic-bezier(.32,.72,0,1)}.history-item img{width:100%;height:100%;object-fit:cover;display:block}.history-item:hover{border-color:var(--accent-line);transform:translateY(-2px)}.lightbox{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;background:#08090bd1;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}.lightbox[hidden]{display:none}.lightbox img{max-width:94vw;max-height:90vh;border-radius:10px;object-fit:contain;box-shadow:0 30px 80px -30px #000000e6}.lightbox-close{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:18px;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid rgba(255,255,255,.18);border-radius:50%;background:#ffffff1a;color:#fff}@media(max-width:1000px){.studio-grid{grid-template-columns:minmax(0,1fr)}.stage{min-height:340px}.stage-result img{max-height:56vh}}@media(max-width:760px){.studio-head{padding:calc(12px + env(safe-area-inset-top,0px)) 14px 10px;gap:10px}.studio-heading{flex-direction:column;align-items:flex-start;gap:1px}.studio-heading h1{font-size:15.5px}.studio-heading span{font-size:10px}.studio-scroll{padding:2px 14px calc(20px + env(safe-area-inset-bottom,0px))}.studio-form{padding:16px;gap:14px;border-radius:18px}.studio-form textarea{min-height:104px;font-size:16px}.stage{min-height:290px;padding:12px;border-radius:18px}.size-chips{grid-template-columns:repeat(2,minmax(0,1fr))}.size-chip{padding:8px 10px;font-size:11px}.result-btn{padding:8px 12px}.history-grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}}@media(max-height:560px){.stage{min-height:240px}.stage-result img{max-height:46vh}}@media(prefers-reduced-motion:reduce){.loading-plate{animation:none}.loading-dots i{animation:none;opacity:.7}.history-item:hover,.generate-btn:not(:disabled):hover{transform:none}}

</head>
<body class="studio-body">

<div class="backdrop" aria-hidden="true"></div>

<main class="studio">
    <header class="studio-head">
        <a class="icon-button glass studio-back" href="/" aria-label="返回对话">
            <span class="ui-icon icon-back" aria-hidden="true"></span>
        </a>
        <div class="studio-heading">
            <h1>素材生成</h1>
            <span>产品图 · 海报 · 朋友圈 · 直播素材</span>
        </div>
        <button class="theme-toggle glass" id="themeToggle" type="button" aria-label="切换深色模式" aria-pressed="false">
            <span class="ui-icon icon-sun" aria-hidden="true"></span>
            <span class="ui-icon icon-moon" aria-hidden="true"></span>
        </button>
    </header>

    <div class="studio-scroll">
        <div class="studio-grid">

            <section class="studio-form glass glass--lens" aria-label="生成设置">
                <div class="field">
                    <div class="field-head">
                        <label for="prompt">想生成什么</label>
                        <span class="char-count" id="charCount">0 / 4000</span>
                    </div>
                    <textarea id="prompt" rows="5" placeholder="例：哑银外盒的产品平铺图，浅色花纹背景，柔光打亮，高级质感，留白供后期加字"></textarea>
                </div>

                <div class="presets" id="presets" aria-label="常用模板">
                    <button type="button" class="chip" data-prompt="薇之雨产品平铺图：哑银外盒静置于浅色花纹台面，柔和侧光，浅景深，画面干净留白，高级护肤品质感，真实摄影风格">产品平铺</button>
                    <button type="button" class="chip" data-prompt="竖版朋友圈海报：橄榄绿与米白配色，大面积留白，雨林光影作为背景虚化，上方预留标题文字区域，极简高级，商业海报风格">海报竖版</button>
                    <button type="button" class="chip" data-prompt="直播贴片背景：9:16 竖屏，深邃雨林绿背景，柔和光斑与雾气，中部留出干净区域放人像与文字，高级不抢眼">贴片背景</button>
                    <button type="button" class="chip" data-prompt="门店场景：干净明亮的美业护理操作台，白色台面与木质细节，自然采光，产品整齐陈列，真实空间摄影">门店场景</button>
                    <button type="button" class="chip" data-prompt="人物氛围图：女性侧脸特写，皮肤通透自然，手持护肤产品靠近面部，柔和自然光，浅色背景，高级美妆广告质感">人物氛围</button>
                </div>

                <div class="field">
                    <div class="field-head"><label>画面比例</label><span class="field-note">默认 1:1 · 2K</span></div>
                    <div class="size-chips" id="sizeChips" role="group" aria-label="画面比例">
                        <button type="button" class="size-chip" data-size="1:1" aria-pressed="true">
                            <span class="ratio-box" style="--r:1/1" aria-hidden="true"></span>
                            <span class="size-label">1:1 方图<span>2048×2048</span></span>
                        </button>
                        <button type="button" class="size-chip" data-size="3:4" aria-pressed="false">
                            <span class="ratio-box" style="--r:3/4" aria-hidden="true"></span>
                            <span class="size-label">3:4 竖版<span>1536×2048</span></span>
                        </button>
                        <button type="button" class="size-chip" data-size="4:3" aria-pressed="false">
                            <span class="ratio-box" style="--r:4/3" aria-hidden="true"></span>
                            <span class="size-label">4:3 横版<span>2048×1536</span></span>
                        </button>
                        <button type="button" class="size-chip" data-size="9:16" aria-pressed="false">
                            <span class="ratio-box" style="--r:9/16" aria-hidden="true"></span>
                            <span class="size-label">9:16 竖屏<span>1152×2048</span></span>
                        </button>
                        <button type="button" class="size-chip" data-size="16:9" aria-pressed="false">
                            <span class="ratio-box" style="--r:16/9" aria-hidden="true"></span>
                            <span class="size-label">16:9 横屏<span>2048×1152</span></span>
                        </button>
                    </div>
                </div>

                <div class="field">
                    <div class="field-head"><label for="refInput">参考图</label><span class="field-note">可选 · 图生图</span></div>
                    <div class="ref-row">
                        <label class="ref-pick" for="refInput">
                            <span class="ui-icon icon-image" aria-hidden="true"></span>
                            <span id="refLabel">上传参考图</span>
                        </label>
                        <input type="file" id="refInput" accept="image/*" hidden>
                        <button type="button" class="ref-clear" id="refClear" hidden>移除</button>
                    </div>
                    <div class="ref-preview" id="refPreview" hidden>
                        <img id="refThumb" alt="参考图预览">
                    </div>
                </div>

                <button type="button" class="generate-btn" id="generateBtn">
                    <span class="ui-icon icon-sparkles" aria-hidden="true"></span>
                    <span id="generateLabel">生成图片</span>
                </button>
                <p class="studio-hint" id="serviceStatus" role="status" hidden></p>
                <p class="studio-hint">生成耗时随排队变化 · 记录保存在此设备，服务器图片会按时效和数量清理，请及时下载</p>
            </section>

            <section class="studio-stage-wrap" aria-label="生成结果">
                <div class="stage" id="stage">
                    <div class="stage-empty" id="stageEmpty">
                        <span class="ui-icon icon-image stage-empty-icon" aria-hidden="true"></span>
                        <p>写清楚画面，选择比例，就能出图</p>
                        <small>默认 2K 出图，可用于详情页、朋友圈、直播间贴片</small>
                    </div>
                    <div class="stage-loading" id="stageLoading" hidden>
                        <div class="loading-plate"></div>
                        <div class="loading-meta">
                            <span class="loading-dots"><i></i><i></i><i></i></span>
                            <span id="loadingText">正在生成 2K 图…</span>
                        </div>
                    </div>
                    <div class="stage-result" id="stageResult" hidden>
                        <img id="resultImg" alt="生成结果">
                        <div class="result-actions">
                            <a class="result-btn" id="downloadBtn" download>下载原图</a>
                            <button class="result-btn" type="button" id="asRefBtn">作为参考图</button>
                            <button class="result-btn" type="button" id="againBtn">再生成一次</button>
                        </div>
                        <p class="result-prompt" id="resultPrompt"></p>
                    </div>
                    <div class="stage-error" id="stageError" hidden>
                        <p id="errorText"></p>
                        <button class="result-btn" type="button" id="errorRetry">重试</button>
                    </div>
                </div>

                <div class="history-block">
                    <div class="history-head">
                        <span>最近生成</span>
                        <button type="button" class="history-clear" id="historyClear" hidden>清空</button>
                    </div>
                    <div class="history-grid" id="historyGrid"></div>
                </div>
            </section>

        </div>
    </div>
</main>

<div class="lightbox" id="lightbox" hidden>
    <img id="lightboxImg" alt="查看大图">
    <button class="lightbox-close" type="button" id="lightboxClose" aria-label="关闭">
        <span class="ui-icon icon-close" aria-hidden="true"></span>
    </button>
</div>

<script src="/static/js/studio.js?v=20261021-2" defer></script>
</body>
</html>
